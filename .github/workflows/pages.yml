name: Deploy PWA

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload web app
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Wait for pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            count=$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" \
              | grep -o '"total_count":[[:space:]]*[0-9]*' | grep -o '[0-9]*' || true)
            if [ "${count:-0}" -gt 0 ]; then
              echo "Артефакт github-pages готов (попытка ${attempt})"
              exit 0
            fi
            sleep 3
          done
          echo "Артефакт github-pages не появился" >&2
          exit 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
